name: go
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: terraform-provider-firstboot }
      # The SDK is consumed through a replace directive until it is published,
      # so it has to be beside this checkout for anything here to build.
      - uses: actions/checkout@v4
        with:
          repository: firstboot-io/firstboot-go
          path: firstboot-go
          token: ${{ secrets.SDK_READ_TOKEN }}
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - working-directory: terraform-provider-firstboot
        run: |
          go build ./...
          go vet ./...
          go test ./...
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi
