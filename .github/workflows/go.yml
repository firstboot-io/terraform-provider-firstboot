name: go
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

  docs:
    # The registry renders `docs/` as the provider's page and regenerates
    # nothing on the way. A schema change with a stale `docs/` therefore ships
    # documentation that describes attributes the provider no longer has, and
    # nobody finds out from the provider. The diff is the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 \
            generate --provider-name firstboot --rendered-provider-name Firstboot
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is behind the provider schema; run tfplugindocs and commit"
            exit 1
          }
